name: Format Diagnostic

on:
  push:
    branches:
      - feat/m01-auth-identity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Print pinned-Prettier diff
        run: |
          pnpm prettier --write apps/server/src/auth/oauth-session.ts apps/server/src/auth/callback-listener.ts
          git diff --no-ext-diff --unified=3 -- apps/server/src/auth/oauth-session.ts apps/server/src/auth/callback-listener.ts
