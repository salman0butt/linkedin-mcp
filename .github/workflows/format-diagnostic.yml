name: Format Diagnostic

on:
  push:
    branches:
      - feat/m01-auth-identity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Print pinned-Prettier output
        run: |
          pnpm prettier --write docs/product/CAPABILITY-MATRIX.md docs/requirements/TRACEABILITY.md docs/superpowers/plans/2026-10-06-m01-auth-identity.md
          echo '=== CAPABILITY-MATRIX BEGIN ==='
          cat docs/product/CAPABILITY-MATRIX.md
          echo '=== CAPABILITY-MATRIX END ==='
          echo '=== TRACEABILITY BEGIN ==='
          cat docs/requirements/TRACEABILITY.md
          echo '=== TRACEABILITY END ==='
          echo '=== PLAN BEGIN ==='
          cat docs/superpowers/plans/2026-10-06-m01-auth-identity.md
          echo '=== PLAN END ==='
