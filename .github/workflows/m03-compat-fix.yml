name: M03 Compatibility Fix

on:
  push:
    branches:
      - feat/m03-media-publishing

permissions:
  contents: write

jobs:
  patch-m03-types:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m03-media-publishing
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply compatibility type fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/server/src/publishing/media-post-service.ts')
          source = service.read_text()
          source = source.replace('  type LinkedInPostsAdapter,\n', '  type MediaLinkedInPostsAdapter,\n', 1)
          source = source.replace(
              "type MediaPostsAdapter = Pick<LinkedInPostsAdapter, 'createImagePost' | 'createMultiImagePost'>;",
              "type MediaPostsAdapter = Pick<MediaLinkedInPostsAdapter, 'createImagePost' | 'createMultiImagePost'>;",
              1,
          )
          service.write_text(source)

          test = Path('apps/server/test/media-post-service.test.ts')
          test_source = test.read_text()
          old = '  const files = new Map([\n'
          new = '  const files = new Map<string, typeof firstFile | typeof secondFile>([\n'
          if old not in test_source:
              raise SystemExit('expected media fixture map not found')
          test.write_text(test_source.replace(old, new, 1))
          PY
          pnpm exec prettier apps/server/src/publishing/media-post-service.ts apps/server/test/media-post-service.test.ts --write
          git fetch origin feat/m03-media-publishing
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/m03-media-publishing)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/publishing/media-post-service.ts apps/server/test/media-post-service.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(m03): preserve Posts compatibility types"
          git push origin HEAD:feat/m03-media-publishing
