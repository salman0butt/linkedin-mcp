name: Prettier Diagnostic

on:
  push:
    branches:
      - feat/m03-media-publishing

permissions:
  contents: write

jobs:
  media-service-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m03-media-publishing
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply canonical media-service formatting
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier apps/server/src/publishing/media-post-service.ts --write
          if git diff --quiet -- apps/server/src/publishing/media-post-service.ts; then
            exit 0
          fi
          git fetch origin feat/m03-media-publishing
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feat/m03-media-publishing)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/src/publishing/media-post-service.ts
          git commit -m "style(m03): format media post service"
          git push origin HEAD:feat/m03-media-publishing
